; ESP-IDF only: prepare and build the pinned Xiaozhi project, not a dummy app.
[platformio]
default_envs = ai-chatbot-s3
src_dir = upstream/main


[env:ai-chatbot-s3]
platform = espressif32@7.1.3
framework = espidf
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = upstream/partitions/v2/16m.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_type = release
; Post scripts resolve relative to PROJECT_DIR, moved to upstream by the pre hook.
extra_scripts = pre:pio_prepare.py, post:../pio_assets.py
    